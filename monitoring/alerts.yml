groups:
  - name: fipro-alerts
    rules:
      - alert: HighApiErrorRate
        expr: api_error_rate_5m > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "API error rate is above 5%"

      - alert: HighReportLatency
        expr: report_generate_p95_ms > 12000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Report generation latency p95 is above threshold"

      - alert: Tier2ToolCallsP95High
        expr: tier2_tool_calls_p95_30m > 76.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TIER2 tool calls p95 is above warning line"

      - alert: Tier2ToolCallsP95Critical
        expr: tier2_tool_calls_p95_30m > 90
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "TIER2 tool calls p95 exceeds budget line"

      - alert: Tier2CostP95High
        expr: tier2_cost_p95_usd_30m > 2.125
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TIER2 cost p95 is above warning line"

      - alert: Tier2CostP95Critical
        expr: tier2_cost_p95_usd_30m > 2.5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "TIER2 cost p95 exceeds budget line"

      - alert: Tier2LatencyP95High
        expr: tier2_latency_p95_ms_30m > 10200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "TIER2 latency p95 is above warning line"

      - alert: Tier2LatencyP95Critical
        expr: tier2_latency_p95_ms_30m > 12000
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "TIER2 latency p95 exceeds budget line"

      - alert: SchemaValidationFailures
        expr: report_schema_fail_rate_15m > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Schema validation failure rate is high"

      - alert: M6ReportFailureRateWarning
        expr: report_failure_rate_15m > 0.024
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "M6 report failure rate exceeds warning line"

      - alert: M6ReportFailureRateCritical
        expr: report_failure_rate_15m > 0.03
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "M6 report failure rate exceeds critical line"

      - alert: M6SchemaPassRateWarning
        expr: report_schema_pass_rate_15m < 0.99
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "M6 schema pass rate is below warning threshold"

      - alert: M6SchemaPassRateCritical
        expr: report_schema_pass_rate_15m < 0.98
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "M6 schema pass rate is below critical threshold"

      - alert: M6CostP95Warning
        expr: report_cost_p95_usd_30m > 2.125
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "M6 report cost p95 exceeds warning line"

      - alert: M6CostP95Critical
        expr: report_cost_p95_usd_30m > 2.5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "M6 report cost p95 exceeds critical line"

      - alert: M6RetryStorm
        expr: tool_retry_rate_5m > 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "M6 tool retry rate indicates possible upstream instability"

      - alert: M7DataDriftPSIWarning
        expr: m7_data_drift_psi_max > 0.20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "M7 data drift PSI exceeds warning threshold"

      - alert: M7DataDriftPSICritical
        expr: m7_data_drift_psi_max > 0.30
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "M7 data drift PSI exceeds critical threshold"

      - alert: M7BehaviorDriftPSICritical
        expr: m7_behavior_drift_psi_max > 0.30
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "M7 behavior drift PSI exceeds critical threshold"

      - alert: M7ModelGateBlocked
        expr: m7_model_gate_blocked > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "M7 model gate is blocked for challenger promotion"
