[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fipro1"
version = "0.1.0"
description = "Hot-Leader Low-Risk Agentic Research Workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.6",
  "neo4j>=5.22.0",
  "langgraph>=0.2.20",
  "jsonschema>=4.23.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "pytest>=8.2.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
